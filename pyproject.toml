[build-system]
requires = ["hatchling>=1.21,<2"]
build-backend = "hatchling.build"

[project]
name = "print-forge"
dynamic = ["version"]
description = "Parametric generators for small FDM batch products: watertight meshes, packed 3MF plates and a batch plan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Navaneeth KG" }]
keywords = ["3d-printing", "fdm", "stl", "3mf", "parametric", "mesh", "bambu-lab", "print-farm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Printing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24,<3"]
dev = [
    "mypy>=1.11,<3",
    "numpy>=1.24,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
print-forge = "print_forge.cli:main"

[project.urls]
Homepage = "https://github.com/projectbin07-stack/print-forge"
Issues = "https://github.com/projectbin07-stack/print-forge/issues"
Changelog = "https://github.com/projectbin07-stack/print-forge/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/print_forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/print_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["stl_doctor.*", "printfarm_planner.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["print_forge"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
